# AI新聞 情報源リスト
#
# 各項目:
#   name:  表示名（source_name として号データに載る）
#   url:   フィードURL
#   lang:  en | ja
#   kind:  official（公式ブログ・リリース）/ media（ニュースメディア）/
#          community（個人・コミュニティ）/ japan（国内メディア・コミュニティ）
#   weight: 収集時の優先度（大きいほど候補選定で優先。1.0が標準）
#
# 検証方法: curl -sL -o /dev/null -w "%{http_code}" <url> で200を確認し、
# feedparser.parse(url) でエントリ数 > 0 であることを確認済み（2026-09-29）。
# 削除した候補と理由は README.md / 実装レポート参照。

