name: サイト公開（AI新聞）

on:
  push:
    branches: [main]
    paths:
      - 'data/issues/**'
  workflow_dispatch:  # 手動実行ボタン（テスト用。この場合は新規号メール通知は行わない）

permissions:
  contents: write   # 画像補完した号データをmainへ書き戻すため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # git diff で「今回のpushで新規追加された号」を検出するため全履歴を取得する
          fetch-depth: 0

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: このpushで新規追加された号データを検出
        id: diff
        if: github.event_name == 'push'
        run: |
          set -eu
          BEFORE="${{ github.event.before }}"
          EMPTY_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$EMPTY_SHA" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # 初回pushなど比較対象が無い場合は、今回のコミット自体の追加分のみを見る
            NEW_FILES=$(git show --name-only --diff-filter=A --pretty=format: "${{ github.sha }}" -- 'data/issues/*.json' || true)
          else
            NEW_FILES=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'data/issues/*.json' || true)
          fi
          DATES=$(echo "$NEW_FILES" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' ' ')
          echo "新規追加された号: ${DATES:-なし}"
          {
            echo "dates<<EOF"
            echo "$DATES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 新規号の画像を補完（routine環境で取れなかった分）
        if: github.event_name == 'push' && steps.diff.outputs.dates != ''
        run: |
          set -eu
          # routineの実行環境は通信先が許可リストに限られるため、一次情報サイトのog:imageを取れないことがある。
          # Actionsは通信制限が無いので、ここで取りこぼしを補完してmainへ書き戻す
          # （GITHUB_TOKENによるpushではワークフローは再起動しない）。
          for d in ${{ steps.diff.outputs.dates }}; do
            python -m src.images "data/issues/$d.json"
          done
          if ! git diff --quiet -- data/issues; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/issues
            git commit -m "images: 画像を補完 (${{ steps.diff.outputs.dates }})"
            git push origin HEAD:main
          fi

      - name: サイトをビルド
        run: python -m src.build --out-dir site

      - name: Pagesアーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 新規号をメール通知
        if: github.event_name == 'push' && steps.diff.outputs.dates != ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -eu
          for d in ${{ steps.diff.outputs.dates }}; do
            echo "通知: $d"
            python -m src.notify --date "$d"
          done
