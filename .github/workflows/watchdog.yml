name: 当日号の生成チェック（watchdog）

on:
  schedule:
    # UTC 22:35 = JST 07:35。routine（毎朝6:30 JST頃実行）が完了しているはずの時間帯に、
    # 当日分の号が生成されているか確認する。毎時35分オフセットはcron混雑回避のため。
    - cron: '35 22 * * *'
  workflow_dispatch:  # 手動実行ボタン（テスト用）

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 当日号の存在確認（無ければアラートメール送信）
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.notify --watchdog
